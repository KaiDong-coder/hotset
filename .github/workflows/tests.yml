name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: placement + tooling unit tests
        run: python3 -I tests/run_tests.py --skip-kernel

  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake
      - name: configure (CPU-only)
        run: cmake -S . -B build -DGGML_CUDA=OFF -DCMAKE_BUILD_TYPE=Release
      - name: build kernel test
        run: cmake --build build -j 4 --target test-mmid-cpu
      - name: unit + fast paths vs generic path
        run: python3 -I tests/run_tests.py
